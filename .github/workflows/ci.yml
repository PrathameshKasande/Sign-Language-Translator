powershell -NoProfile -Command "@'
name: Build and Validate Docker Container

on:
  push:
    branches: [ 'main' ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ 'main' ]

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: sign-language-translator:ci

      - name: Test Container Startup & Health
        run: |
          docker run -d -p 5000:5000 -e CUDA_VISIBLE_DEVICES=\"-1\" --name test_app sign-language-translator:ci
          
          # Allow TensorFlow and Gunicorn sufficient time to load model weights into RAM
          sleep 35
          
          echo '=== Container Startup Logs ==='
          docker logs test_app
          
          # Verify the process didn't terminate
          if ! docker ps | grep -q test_app; then
            echo 'CRITICAL: Container crashed upon startup.'
            exit 1
          fi
          
          STATUS_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ || echo '000')
          echo 'HTTP Response Status Code: '$STATUS_CODE
          
          # Any valid HTTP response indicates the server is listening
          if [ \"$STATUS_CODE\" != \"000\" ] && [ \"$STATUS_CODE\" != \"502\" ]; then
            echo 'SUCCESS: Container booted and web server is alive.'
          else
            echo 'FAILURE: Server unreachable.'
            exit 1
          fi

      - name: Cleanup Test Container
        if: always()
        run: |
          docker rm -f test_app || true
'@ | Out-File -FilePath '.github\workflows\ci.yml' -Encoding utf8"