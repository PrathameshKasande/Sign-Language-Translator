<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Language English Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #c6ffdd, #fbd786, #f7797d);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .card {
            margin-top: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background-color: white;
        }
        .btn-custom {
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Sign Language English Converter</h1>
        <p class="lead">Empowering communication through technology</p>
    </div>

    <div class="container text-center">
        <div class="card p-5">
            <h2 class="mb-4">Welcome, {{ user }}</h2>
            <p class="lead">Click below to start or stop the sign language recognition window.</p>
            <div class="d-grid gap-2 col-6 mx-auto mt-4">
                <a href="/start" class="btn btn-success btn-lg btn-custom">Start Application</a>
                <a href="/stop" class="btn btn-warning btn-lg btn-custom">Stop Application</a>
                <a href="/logout" class="btn btn-secondary btn-custom">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
