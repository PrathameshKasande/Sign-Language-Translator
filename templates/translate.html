<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Language To Text & Speech Conversion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .header a {
      color: #6b7280;
      text-decoration: none;
      font-size: 12px;
    }
    .video-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .frame-box {
      width: 48%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .info-panel {
      max-width: 580px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 2.2;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .label {
      font-weight: 500;
      color: #111827;
    }
    .value {
      font-weight: bold;
      color: #111827;
      margin-left: 10px;
    }
    .btn {
      width: 90px;
      padding: 6px 0;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-speak { background-color: #16a34a; }
    .btn-clear { background-color: #dc2626; }
    .btn-space { background-color: #2563eb; }
    .suggestions-box {
      display: flex;
      gap: 6px;
      margin-left: 10px;
    }
    .sug-slot {
      width: 24px;
      height: 24px;
      border: 1px solid #9ca3af;
      border-radius: 2px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="header">
    <span>🤟 Sign Language To Text & Speech Conversion</span>
    <a href="/home">← Back to Dashboard</a>
  </div>

  <div class="video-container">
    <div class="frame-box">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div class="frame-box">
      <img id="skeleton_view" alt="Hand Skeleton" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
    </div>
  </div>

  <canvas id="capture_canvas" width="300" height="300" style="display: none;"></canvas>

  <div class="info-panel">
    <div class="row">
      <div><span class="label">Character :</span> <span id="char_val" class="value">-</span></div>
      <button class="btn btn-speak" onclick="speakSentence()">Speak</button>
    </div>
    <div class="row">
      <div><span class="label">Sentence :</span> <span id="sentence_val" class="value"></span></div>
      <button class="btn btn-clear" onclick="clearSentence()">Clear</button>
    </div>
    <div class="row" style="margin-top: 5px;">
      <div style="display: flex; align-items: center;">
        <span class="label">Suggestions :</span>
        <div class="suggestions-box">
          <div class="sug-slot"></div>
          <div class="sug-slot"></div>
          <div class="sug-slot"></div>
          <div class="sug-slot"></div>
        </div>
      </div>
      <button class="btn btn-space" onclick="addSpaceManual()">Space</button>
    </div>
  </div>

  <script>
    const video = document.getElementById("webcam");
    const skeletonImg = document.getElementById("skeleton_view");
    const captureCanvas = document.getElementById("capture_canvas");
    const ctx = captureCanvas.getContext("2d");

    const charVal = document.getElementById("char_val");
    const sentenceVal = document.getElementById("sentence_val");

    navigator.mediaDevices.getUserMedia({ video: { width: 300, height: 300, facingMode: "user" } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => console.error("Webcam Error:", err));

    let isSending = false;

    // Send frames to backend
    setInterval(() => {
      if (video.readyState === video.HAVE_ENOUGH_DATA && !isSending) {
        isSending = true;
        ctx.drawImage(video, 0, 0, 300, 300);
        const dataUrl = captureCanvas.toDataURL("image/jpeg", 0.65);

        fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: dataUrl })
        })
        .then(res => res.json())
        .then(data => {
          if (data.character !== undefined) charVal.innerText = data.character || "-";
          if (data.sentence !== undefined) sentenceVal.innerText = data.sentence;
          if (data.skeleton) skeletonImg.src = data.skeleton;
        })
        .catch(err => console.error("Inference Error:", err))
        .finally(() => { isSending = false; });
      }
    }, 120);

    // Speak Button (Browser Native Web Speech API)
    function speakSentence() {
      const text = sentenceVal.innerText.trim();
      if (text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Clear Button
    function clearSentence() {
      fetch("/clear", { method: "POST" })
        .then(() => {
          sentenceVal.innerText = "";
          charVal.innerText = "-";
        });
    }

    // Space Button
    function addSpaceManual() {
      fetch("/space", { method: "POST" })
        .then(() => {
          sentenceVal.innerText += " ";
        });
    }
  </script>
</body>
</html>
